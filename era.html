<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone Eras</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% 20%,#262b38,#0b0c10 70%);color:#eee;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px;flex-wrap:wrap}
.top a.back{color:#9cc8ff;text-decoration:none;font-weight:600;font-size:14px}
.eras{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:12px}
.eras a{color:#aab;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:9px;transition:background .2s,color .2s}
.eras a.on{background:#fff;color:#000}.eras a:hover:not(.on){color:#fff}
.stagew{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.hint{font-size:13px;color:#8a92a6;text-align:center;padding:0 16px 14px;max-width:520px;line-height:1.5;min-height:34px}
/* device */
.ph{position:absolute;left:50%;top:50%;transform-origin:center;border-radius:54px;background:#111;flex:none}
.ph.flat{width:340px;height:690px;background:linear-gradient(160deg,#d8dadf,#a9adb4);border-radius:56px;box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 2px #eee}
.ph.flat:after{content:"";position:absolute;inset:6px;border-radius:50px;background:#f7f7f8}
.ph.notch,.ph.island{width:324px;height:674px;border-radius:56px;background:#1c1c1e;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 3px #b9bcc4,0 0 0 4px #6d7078}
.ph.island{box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 3px #c9a98a,0 0 0 4px #7a6450}
.sbtn{position:absolute;background:#9a9da4;border-radius:2px;z-index:-1}
.scr{position:absolute;overflow:hidden;background:#000;z-index:1;touch-action:none}
.flat .scr{left:20px;top:78px;width:300px;height:533px;border-radius:2px}
.notch .scr,.island .scr{left:12px;top:12px;width:300px;height:650px;border-radius:44px}
.speaker{position:absolute;left:50%;top:36px;width:56px;height:6px;margin-left:-28px;border-radius:3px;background:#3a3b3f;z-index:2}
.fcam{position:absolute;left:50%;top:34px;width:10px;height:10px;margin-left:-60px;border-radius:50%;background:#2a2c33;z-index:2}
.hb{position:absolute;left:50%;bottom:16px;width:56px;height:56px;margin-left:-28px;border-radius:50%;background:#f3f3f5;box-shadow:inset 0 0 0 2px #c7c9ce,inset 0 2px 3px rgba(0,0,0,.1);z-index:2;cursor:pointer}
.hb:active{box-shadow:inset 0 0 0 2px #a7a9ae,inset 0 3px 6px rgba(0,0,0,.25)}
/* layers */
#wall{position:absolute;inset:-20px;background-size:cover;background-position:center;transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s}
#home{position:absolute;inset:0;display:flex;flex-direction:column;transition:none}
#app{position:absolute;inset:0;display:none;background:var(--abg);color:var(--atxt);overflow:hidden;z-index:5}
#lock{position:absolute;inset:0;z-index:10;color:#fff;display:flex;flex-direction:column;align-items:center}
#cc{position:absolute;left:0;right:0;z-index:20;display:none}
#sb{position:absolute;left:0;right:0;top:0;height:24px;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;font-weight:600;color:#fff;pointer-events:none;transition:color .25s}
.notch #sb,.island #sb{height:46px;padding:0 24px 0 26px;font-size:15px}
#sb.dk{color:#000}
#hi{position:absolute;left:50%;bottom:8px;width:120px;height:5px;margin-left:-60px;border-radius:3px;background:#fff;z-index:26;transition:background .25s;cursor:pointer}
#hi.dk{background:#111}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:60;opacity:0}
#banner{position:absolute;z-index:30;left:8px;right:8px;top:6px;transform:translateY(calc(-100% - 80px));transition:transform .5s cubic-bezier(.2,1.2,.4,1);cursor:pointer}
#banner.on{transform:none}
.flat #banner{left:0;right:0;top:0;background:rgba(20,20,22,.88);color:#fff;padding:26px 12px 10px;backdrop-filter:blur(10px)}
.notch #banner,.island #banner{top:44px;background:rgba(245,245,247,.92);color:#000;border-radius:16px;padding:10px 12px;backdrop-filter:blur(14px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
#banner small{display:block;font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.5px}
#banner b{font-size:14px}#banner div{font-size:13px}
/* notch + island */
.cut{position:absolute;left:50%;top:0;z-index:40;background:#000;pointer-events:none}
.notch .cut{width:164px;height:30px;margin-left:-82px;border-radius:0 0 20px 20px}
#isl{position:absolute;left:50%;top:11px;z-index:40;background:#000;color:#fff;transform:translateX(-50%);width:96px;height:28px;border-radius:16px;
  transition:width .55s cubic-bezier(.3,1.35,.5,1),height .55s cubic-bezier(.3,1.35,.5,1),border-radius .5s,top .4s;overflow:hidden;cursor:pointer;display:none}
.island #isl{display:block}
#isl .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px;opacity:0;transition:opacity .25s .15s;font-size:12px;font-weight:600}
#isl.c .in{opacity:1}
#isl.x{border-radius:40px}
#isl.x .in{flex-direction:column;justify-content:center;gap:8px;padding:14px 18px;align-items:stretch}
.iart{width:22px;height:22px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px}
.bars{display:flex;gap:2px;align-items:center;height:14px}.bars i{width:3px;border-radius:2px;background:var(--ac,#ff5a7a);animation:bar .8s ease-in-out infinite alternate}
.bars i:nth-child(2){animation-delay:-.2s}.bars i:nth-child(3){animation-delay:-.45s}.bars i:nth-child(4){animation-delay:-.6s}
@keyframes bar{from{height:3px}to{height:14px}}
.paused .bars i{animation-play-state:paused}
.xrow{display:flex;align-items:center;gap:10px}.xrow .iart{width:44px;height:44px;border-radius:10px;font-size:22px}
.xrow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xrow span{font-size:12px;color:#999}
.xctl{display:flex;justify-content:space-around;font-size:22px}.xctl button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.xbar{height:4px;border-radius:2px;background:#444;overflow:hidden}.xbar i{display:block;height:100%;background:#fff}
/* home */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 0;padding:34px 10px 0;align-content:start;flex:1}
.notch .grid,.island .grid{padding-top:60px;gap:22px 0}
.ico{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#fff;background:none;border:0;cursor:pointer;font-family:inherit;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ico i{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-style:normal;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s,filter .15s}
.notch .ico i,.island .ico i{border-radius:15px;width:60px;height:60px}
.ico:active i{transform:scale(.9);filter:brightness(.8)}
.dock{margin:0 8px 8px;padding:12px 6px;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.flat .dock{margin:0;border-radius:0;background:rgba(255,255,255,.3)}
.notch .dock,.island .dock{border-radius:30px;margin:0 10px 20px}
.dock .ico span{display:none}
.notch .dock .ico span,.island .dock .ico span{display:none}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i:first-child{background:#fff}
.widget{grid-column:span 4;margin:0 6px;height:150px;border-radius:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:14px 16px;display:flex;justify-content:space-between;color:#fff;cursor:pointer}
.widget .wl b{font-size:13px;color:#ff6b6b;text-transform:uppercase}.widget .wl div{font-size:42px;font-weight:300;line-height:1}.widget .wl small{font-size:13px;opacity:.85}
.widget .wr{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;text-align:right;max-width:55%}
.widget .wr .iart{width:56px;height:56px;border-radius:12px;font-size:26px}
.widget .wr b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.widget .wr span{font-size:12px;opacity:.8}
/* lock */
.flat #lock .lt{margin-top:52px;font-size:76px;font-weight:200;letter-spacing:-1px}
.flat #lock .ld{font-size:17px;font-weight:300}
.flat #lock .slide{margin-top:auto;margin-bottom:38px;font-size:22px;font-weight:300;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.4) 40%,#fff 50%,rgba(255,255,255,.4) 60%,rgba(255,255,255,.4) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-50% 0}}
.lockc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.notch #lock .pad,.island #lock .pad{margin-top:56px;font-size:20px;transition:transform .3s}
.notch #lock .ld,.island #lock .ld{margin-top:6px;font-size:18px;font-weight:600;opacity:.9}
.notch #lock .lt{font-size:82px;font-weight:200;line-height:1}
.island #lock .lt{font-size:96px;font-weight:700;line-height:1;letter-spacing:-2px}
.island #lock .ld{margin-top:6px}
.lwid{display:flex;gap:8px;margin-top:10px}.lwid div{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:600}
.swipe{margin-top:auto;margin-bottom:30px;font-size:14px;opacity:.85;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.lmedia{margin-top:18px;width:268px;border-radius:18px;background:rgba(0,0,0,.35);backdrop-filter:blur(14px);padding:12px;display:flex;flex-direction:column;gap:8px}
.flat .lmedia{border-radius:0;background:rgba(0,0,0,.25);width:100%}
.lmedia .xrow b{color:#fff}
.lmedia .xctl button{font-size:20px}
/* control center */
.flat #cc{bottom:0;top:auto;background:rgba(245,245,247,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#000;padding:10px 14px 14px;border-top:1px solid rgba(0,0,0,.1)}
.notch #cc,.island #cc{top:0;bottom:0;background:rgba(0,0,0,.35);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);padding:60px 18px 18px;color:#fff}
.ccg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ccb{aspect-ratio:1;border-radius:50%;border:0;background:rgba(0,0,0,.08);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.notch .ccb,.island .ccb{border-radius:18px;background:rgba(255,255,255,.18);color:#fff}
.ccb:active{transform:scale(.92)}.ccb.on{background:#fff}.flat .ccb.on{background:#0a84ff;color:#fff}
.ccb.on.blue{background:#0a84ff;color:#fff}
.ccs{display:flex;align-items:center;gap:8px;margin:14px 0}.ccs input{flex:1;accent-color:#0a84ff}
.notch .ccs input,.island .ccs input{accent-color:#fff}
.ccm{border-radius:18px;padding:10px 12px;margin-bottom:12px;background:rgba(0,0,0,.05)}
.notch .ccm,.island .ccm{background:rgba(255,255,255,.18)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(0,0,0,.25);margin:0 auto 10px}
.notch .grab,.island .grab{display:none}
.torch{position:absolute;left:50%;top:-140px;width:260px;height:180px;margin-left:-130px;background:radial-gradient(ellipse at 50% 100%,rgba(255,250,220,.55),transparent 70%);pointer-events:none;opacity:0;transition:opacity .3s;z-index:0}
.torch.on{opacity:1}
/* apps */
.scr{--abg:#fff;--atxt:#000;--sep:#d8d8dc;--cell:#fff;--grp:#f2f2f7;--ac:#0a84ff;--mut:#8a8a8e}
.scr.dark{--abg:#000;--atxt:#fff;--sep:#2c2c2e;--cell:#1c1c1e;--grp:#000;--mut:#8e8e93}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--abg);overflow:hidden}
.nb{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:28px 10px 8px;border-bottom:1px solid var(--sep);position:relative;min-height:66px;background:var(--abg)}
.notch .nb,.island .nb{padding-top:50px;min-height:92px;border-bottom:0;flex-direction:column;align-items:flex-start;padding-left:16px}
.nb h1{margin:0;font-size:17px;font-weight:600;position:absolute;left:60px;right:60px;text-align:center;bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notch .nb h1,.island .nb h1{position:static;font-size:32px;font-weight:700;text-align:left;margin-top:6px}
.nb .bk,.nb .rt{background:none;border:0;color:var(--ac);font-size:16px;cursor:pointer;padding:0;font-family:inherit;z-index:1}
.notch .nb .bk,.island .nb .bk{position:absolute;top:50px;left:10px}
.nb .rt{position:absolute;right:12px;bottom:10px}.notch .nb .rt,.island .nb .rt{top:50px;bottom:auto}
.bd{flex:1;overflow-y:auto;position:relative}
.cell{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--sep);background:var(--cell);cursor:pointer;min-height:48px;transition:background .15s}
.cell:active{background:var(--sep)}
.cell .m{flex:1;min-width:0}.cell b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell small{color:var(--mut);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ch{color:var(--mut)}
.th{width:44px;height:44px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
.grp{background:var(--grp);padding:16px 0}
.grp .cell:first-child{border-top:1px solid var(--sep)}
.tog{width:50px;height:30px;border-radius:15px;background:var(--sep);position:relative;transition:background .25s;flex:none}
.tog:after{content:"";position:absolute;left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.tog.on{background:#34c759}.tog.on:after{transform:translateX(20px)}
.empty{padding:40px 24px;text-align:center;color:var(--mut);font-size:14px}
.mini{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px 10px;border-top:1px solid var(--sep);background:var(--cell);cursor:pointer}
.notch .mini,.island .mini{padding-bottom:26px}
.mini b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini button{background:none;border:0;font-size:20px;color:var(--atxt);cursor:pointer}
.np{position:absolute;inset:0;background:var(--abg);z-index:3;display:flex;flex-direction:column;align-items:center;padding:30px 26px 30px;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.notch .np,.island .np{padding-top:54px;border-radius:14px 14px 0 0}
.np.on{transform:none}
.np .grab{background:var(--sep);display:block}
.npart{width:230px;height:230px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:90px;box-shadow:0 16px 40px rgba(0,0,0,.35);transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.np.paused .npart{transform:scale(.82)}
.np h2{margin:22px 0 2px;font-size:20px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np p{margin:0;color:var(--mut)}
.np input[type=range]{width:100%;accent-color:var(--atxt);margin-top:18px}
.np .tm{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.np .ctl{display:flex;justify-content:space-around;width:100%;margin-top:10px}
.np .ctl button{background:none;border:0;font-size:34px;color:var(--atxt);cursor:pointer;transition:transform .15s}.np .ctl button:active{transform:scale(.85)}
.np .ctl .pp{font-size:46px}
.calc{background:#000;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 12px 26px;color:#fff}
.flat .calc{padding:0;background:#1c1c1e}
.cdisp{font-size:64px;font-weight:200;text-align:right;padding:6px 10px;white-space:nowrap;overflow:hidden}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.flat .ckeys{gap:1px;background:#000}
.ckeys button{height:62px;border-radius:31px;border:0;background:#333;color:#fff;font-size:26px;cursor:pointer;font-family:inherit;transition:filter .15s}
.flat .ckeys button{border-radius:0;height:68px;background:#e6e6e8;color:#000;font-weight:300}
.ckeys .op{background:#ff9f0a!important;color:#fff!important}.ckeys .fn{background:#a5a5a5;color:#000}.flat .ckeys .fn{background:#d4d4d6}
.ckeys .z{grid-column:span 2;text-align:left;padding-left:26px}
.ckeys button:active{filter:brightness(1.4)}
textarea.note{flex:1;border:0;padding:12px 16px;font:17px/1.45 -apple-system,"Helvetica Neue",Arial;background:var(--abg);color:var(--atxt);resize:none;outline:none;-webkit-user-select:text;user-select:text}
.flat textarea.note{background:#fbf8ef repeating-linear-gradient(transparent 0 24px,#e5dfcb 24px 25px);font-family:"Noteworthy","Marker Felt",cursive;line-height:25px}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:5px}
.bub{max-width:76%;padding:7px 12px;border-radius:18px;font-size:15px;line-height:1.3;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.bub.me{align-self:flex-end;background:#0a84ff;color:#fff;transform-origin:right bottom}
.bub.them{align-self:flex-start;background:var(--grp);color:var(--atxt);transform-origin:left bottom}
.scr:not(.dark) .bub.them{background:#e9e9eb}
.bub.new{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.3);opacity:0}}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#999;margin:0 1px;animation:dot 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.35}30%{opacity:1;transform:translateY(-3px)}}
.mbar{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--sep);margin:0;flex:none;background:var(--abg)}
.notch .mbar,.island .mbar{padding-bottom:28px}
.mbar input{flex:1;min-width:0;border:1px solid var(--sep);border-radius:18px;padding:8px 12px;font-size:15px;outline:none;background:var(--abg);color:var(--atxt);-webkit-user-select:text;user-select:text}
.mbar button{border:0;background:#0a84ff;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.wx{min-height:100%;color:#fff;display:flex;flex-direction:column;align-items:center;padding:60px 18px 30px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.wx .c{font-size:28px}.wx .t{font-size:84px;font-weight:200;line-height:1}.wx .d{font-size:16px}
.wdays{width:100%;margin-top:18px;background:rgba(255,255,255,.15);border-radius:14px;padding:4px 14px}
.wdays div{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;border-bottom:1px solid rgba(255,255,255,.15)}.wdays div:last-child{border:0}
.wcity{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.wcity button{border:0;border-radius:14px;padding:6px 11px;background:rgba(255,255,255,.22);color:#fff;font-size:12px;cursor:pointer}.wcity button.on{background:#fff;color:#123}
.tmr{display:flex;flex-direction:column;align-items:center;padding:20px}
.ring{position:relative;width:220px;height:220px}.ring svg{transform:rotate(-90deg)}.ring circle{transition:stroke-dashoffset .5s linear}
.ring div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:200;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.chips button{border:0;border-radius:16px;padding:8px 14px;background:var(--grp);color:var(--atxt);font-size:14px;cursor:pointer}
.scr:not(.dark) .chips button{background:#ececf0}
.chips button.on{background:#ff9f0a;color:#fff}
.tb{display:flex;gap:20px}.tb button{width:84px;height:84px;border-radius:50%;border:0;font-size:16px;cursor:pointer;font-family:inherit}

  ${E==='island'?`<div class="ld">${n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div><div class="lt">${n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'')}</div><div class="lwid"><div>⛅ Weather</div><div>🔋 100%</div>${T.running?`<div style="color:#ffb340">⏱ ${fmt(Math.ceil(tLeft()))}</div>`:''}</div>`
   :`<div class="lt">${n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'')}</div><div class="ld">${n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div>`}
  ${t?`<div class="lmedia"><div class="xrow"><div class="iart" style="${art(t)}">${t.emo}</div><div style="min-width:0"><b>${esc(t.title)}</b><span>${esc(t.artist)}</span></div></div><div class="xctl"><button data-l="p">⏮</button><button data-l="t">${audio.paused?'▶':'⏸'}</button><button data-l="n">⏭</button></div></div>`:''}
  ${E!=='island'&&T.running?`<div class="lmedia"><div class="xrow"><div class="iart" style="background:#ff9f0a">⏱</div><div><b>Timer</b><span>${fmt(Math.ceil(tLeft()))} left</span></div></div></div>`:''}
  <div class="${E==='flat'?'slide':'swipe'}">${E==='flat'?'slide to unlock ›':'Swipe up to open'}</div></div>`;
  if(lock.dataset.k===h)return;lock.dataset.k=h;lock.innerHTML=h;
  lock.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const k=b.dataset.l;k==='t'?toggle():k==='n'?next():prev()})}
function unlock(){locked=false;const lc=lock.querySelector('.lockc');const pad=lock.querySelector('.pad');if(pad)pad.textContent='🔓';
  const an=lock.animate(E==='flat'?[{transform:lc.style.transform||'none',opacity:1},{transform:'translateX(100%)',opacity:0}]:[{transform:lc.style.transform||'none',opacity:1},{transform:'translateY(-100%)',opacity:.4}],{duration:380,easing:E2,fill:'forwards'});
  lc.style.transform='';const done=()=>{lock.style.display='none';an.cancel()};an.onfinish=done;setTimeout(()=>{if(!locked)done()},460);
  drawHome();home.querySelectorAll('.ico,.widget').forEach((b,i)=>b.animate([{transform:'scale(1.6)',opacity:0},{transform:'none',opacity:1}],{duration:520,delay:60+i*18,easing:E2,fill:'backwards'}));drawSB()}
function relock(){if(curApp){const a=curApp;curApp=null;app.style.display='none';app.innerHTML='';a.close&&a.close();home.getAnimations().forEach(x=>x.cancel());$('#wall').style.transform='';$('#wall').style.filter=''}
  closeCC();locked=true;lock.style.display='flex';drawLock();lock.animate([{opacity:0},{opacity:1}],{duration:250});drawSB()}
// ---------- control center
function drawCC(){const t=cur();cc.innerHTML=`<div class="grab"></div>
  <div class="ccg"><button class="ccb ${ccS.air?'on':''}" data-c="air" style="${ccS.air?'background:#ff9f0a;color:#fff':''}">✈️</button><button class="ccb on blue" data-c="wifi">${ccS.wifi?'📶':'🚫'}</button><button class="ccb ${ccS.bt?'on blue':''}" data-c="bt">ᛒ</button><button class="ccb ${ccS.dnd?'on':''}" data-c="dnd" style="${ccS.dnd?'background:#5e5ce6;color:#fff':''}">🌙</button></div>
  <div class="ccm" style="margin-top:12px"><div class="xrow"><div class="iart" style="${t?art(t):'background:rgba(127,127,127,.3)'};width:36px;height:36px">${t?t.emo:'🎵'}</div><div style="min-width:0;flex:1"><b style="color:inherit">${t?esc(t.title):'Not Playing'}</b><span>${t?esc(t.artist):''}</span></div>
    <button class="ccb" data-c="play" style="width:38px;aspect-ratio:1;background:none">${t&&!audio.paused?'⏸':'▶'}</button><button class="ccb" data-c="next" style="width:38px;aspect-ratio:1;background:none">⏭</button></div></div>
  <div class="ccs">🔅<input type="range" min="30" max="100" value="${st.bright}" class="br">☀️</div><div class="ccs">🔈<input type="range" min="0" max="100" value="${audio.volume*100}" class="vo">🔊</div>
  <div class="ccg"><button class="ccb ${ccS.torch?'on':''}" data-c="torch">🔦</button><button class="ccb" data-c="timer">⏱</button><button class="ccb" data-c="calc">🧮</button><button class="ccb" data-c="cam">📷</button></div>`;
  cc.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;
    if(k==='play')toggle();else if(k==='next')next();else if(k==='torch'){ccS.torch=!ccS.torch;$('#torch').classList.toggle('on',ccS.torch)}else if(['timer','calc','cam'].includes(k)){closeCC();if(!locked){if(curApp)closeApp();setTimeout(()=>openApp(k==='timer'?'clock':k==='cam'?'camera':'calc'),curApp?450:250)}return}else ccS[k]=!ccS[k];setTimeout(drawCC,30)});
  cc.querySelector('.br').oninput=e=>{st.bright=+e.target.value;save();applyLook()};cc.querySelector('.vo').oninput=e=>audio.volume=e.target.value/100}
const ccS={air:false,wifi:true,bt:true,dnd:false,torch:false};
function openCC(){ccOpen=true;drawCC();cc.style.display='block';cc.style.transform='';cc.animate(E==='flat'?[{transform:'translateY(100%)'},{transform:'none'}]:[{transform:'translateY(-30px) scale(1.05)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:E2});drawSB()}
function closeCC(){if(!ccOpen)return;ccOpen=false;const an=cc.animate(E==='flat'?[{transform:cc.style.transform||'none'},{transform:'translateY(100%)'}]:[{opacity:1},{opacity:0,transform:'scale(1.05)'}],{duration:280,easing:E2,fill:'forwards'});const d=()=>{cc.style.display='none';an.cancel();cc.style.transform=''};an.onfinish=d;setTimeout(()=>{if(!ccOpen)d()},360);drawSB()}
// ---------- gestures
let g=null;
const P=e=>{const r=scr.getBoundingClientRect();return{x:(e.clientX-r.left)/K,y:(e.clientY-r.top)/K}};
scr.addEventListener('pointerdown',e=>{const p=P(e);g=null;if(e.target.closest('#isl'))return;
  if(ccOpen){if(!e.target.closest('#cc')||e.target===cc){g={t:'ccclose',...p};scr.setPointerCapture(e.pointerId)}return}
  if(locked){if(e.target.closest('button'))return;g={t:'lock',x0:p.x,y0:p.y};scr.setPointerCapture(e.pointerId);const pad=lock.querySelector('.pad');if(pad)setTimeout(()=>{if(g&&g.t==='lock')pad.style.transform='scale(1.2)'},150);return}
  if(E==='flat'&&p.y>C.sh-26&&!e.target.closest('input')){g={t:'ccup',x0:p.x,y0:p.y};scr.setPointerCapture(e.pointerId);return}
  if(E!=='flat'&&p.y<40&&p.x>C.sw*.62){g={t:'ccdown',x0:p.x,y0:p.y};scr.setPointerCapture(e.pointerId);return}
  if(E!=='flat'&&p.y>C.sh-30&&!e.target.closest('input,button,.mbar')){g={t:'home',x0:p.x,y0:p.y};scr.setPointerCapture(e.pointerId)}});
scr.addEventListener('pointermove',e=>{if(!g)return;const p=P(e),dx=p.x-g.x0,dy=g.y0-p.y;g.dx=dx;g.dy=dy;
  if(g.t==='lock'){const lc=lock.querySelector('.lockc');if(E==='flat')lc.style.transform=`translateX(${Math.max(0,dx)}px)`;else lc.style.transform=`translateY(${-Math.max(0,dy)}px)`;lc.style.opacity=1-Math.max(0,E==='flat'?dx:dy)/400}
  else if(g.t==='home'&&curApp){const d=Math.max(0,dy),s=1-Math.min(d,320)/320*.5;app.style.transformOrigin='50% 100%';app.style.transform=`translate(${dx*.3}px,${-d*.5}px) scale(${s})`;app.style.borderRadius='40px'}
  else if(g.t==='ccup'&&dy>10){if(!ccOpen){ccOpen=true;drawCC();cc.style.display='block'}const h=cc.offsetHeight;cc.style.transform=`translateY(${Math.max(0,h-dy)}px)`}
  else if(g.t==='ccdown'&&-dy>10){if(!ccOpen){ccOpen=true;drawCC();cc.style.display='block';drawSB()}cc.style.opacity=Math.min(1,-dy/150);cc.style.transform=`scale(${1.05-Math.min(-dy,150)/150*.05})`}
  else if(g.t==='ccclose'&&E==='flat'){cc.style.transform=`translateY(${Math.max(0,-dy)}px)`}});
scr.addEventListener('pointerup',e=>{if(!g)return;const t=g;g=null;const dx=t.dx||0,dy=t.dy||0;
  if(t.t==='lock'){const lc=lock.querySelector('.lockc'),pad=lock.querySelector('.pad');if(pad)pad.style.transform='';if((E==='flat'?dx:dy)>110)unlock();else{lc.animate([{transform:lc.style.transform||'none',opacity:lc.style.opacity||1},{transform:'none',opacity:1}],{duration:450,easing:'cubic-bezier(.3,1.5,.5,1)'});lc.style.transform='';lc.style.opacity=''}}
  else if(t.t==='home'){if(curApp){if(dy>70||Math.abs(dy)<6)closeApp();else{const s=app.style.transform;app.style.transform='';app.style.borderRadius='';app.animate([{transform:s},{transform:'none'}],{duration:400,easing:'cubic-bezier(.3,1.4,.5,1)'})}}}
  else if(t.t==='ccup'){if(dy>60){ccOpen=true;cc.animate([{transform:cc.style.transform||'none'},{transform:'none'}],{duration:300,easing:E2});cc.style.transform='';drawSB()}else{ccOpen=true;closeCC()}}
  else if(t.t==='ccdown'){cc.style.opacity='';cc.style.transform='';if(-dy>60){ccOpen=true;drawSB()}else{ccOpen=true;closeCC()}}
  else if(t.t==='ccclose'){if(E==='flat'&&-dy>40||Math.abs(dy)<6&&Math.abs(dx)<6)closeCC();else cc.style.transform=''}});
scr.addEventListener('pointercancel',()=>{g=null});
if($('#hb'))$('#hb').onclick=()=>{beep(300,.03,.03);if(ccOpen){closeCC();return}if(locked){const lc=lock.querySelector('.lockc');lc.animate([{transform:'none'},{transform:'translateX(30px)'},{transform:'none'}],{duration:450,easing:'cubic-bezier(.3,1.5,.5,1)'});return}if(curApp)closeApp()};
$('#pwr').onclick=()=>{if(locked){unlock()}else relock()};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='Escape'){if(ccOpen)closeCC();else if(curApp)closeApp();else if(!locked)relock()}else if(e.key===' '){e.preventDefault();toggle()}else if(e.key==='Enter'&&locked)unlock()});
// ---------- ticker
let lastTimerDone=0;
function tick(){if(T.running&&!T.paused&&tLeft()<=0){T.running=false;beep(880,.25,.08);setTimeout(()=>beep(880,.25,.08),350);setTimeout(()=>beep(1175,.4,.08),700);banner('Timer','Timer done ⏰','⏱');if(E==='island')islOpen=0}
  islDraw();if(curApp&&curApp.upd)curApp.upd();if(locked&&lock.style.display!=='none'&&!g)drawLock();if(!curApp&&!locked)updHome();if(ccOpen&&!g)null;drawSB()}
function updHome(){const w=home.querySelector('.widget');if(w){const t=cur(),b=w.querySelector('.wr b');if(b&&b.textContent!==(t?t.title:'Not Playing'))drawHome()}}
setInterval(tick,500);
drawHome();drawLock();drawSB();islDraw();
</script>
</body>
